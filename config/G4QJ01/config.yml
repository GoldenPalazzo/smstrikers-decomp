# Suppress dtk false-positive relocations in LidOpenMessage image data. These
# words are compressed-image bytes, not code pointers.
block_relocations:
  # These words happen to equal BuildFrameTable + 0x510.
  - source: .rodata:0x8029302C
  - source: .rodata:0x80294104
  # This word happens to equal DrawSmile + 0x350.
  - source: .rodata:0x80298244
  # The BMD skin chunk ID 0x8001B008 happens to equal
  # UseTeamPowerup + 0xE8. These two instructions form the literal chunk ID,
  # not a code pointer.
  - source: .text:0x801C1F88
  - source: .text:0x801C1F8C
  # The world physics chunk ID 0x8001D000 happens to equal
  # ShouldIStrafe + 0x174. These instructions form the literal chunk ID,
  # not a code pointer.
  - source: .text:0x801993EC
  - source: .text:0x801993F0

# __start.c, OSThread.c, and dolphin_trk.c load the version-specific stack
# linker symbols.
# dtk cannot evaluate the linker-script stack arithmetic while reconstructing
# these objects, so preserve the retail relocation pairs instead of baked JP
# addresses.
add_relocations:
  - source: .init:0x80005410
    type: hi
    target: _stack_addr
  - source: .init:0x80005414
    type: l
    target: _stack_addr
