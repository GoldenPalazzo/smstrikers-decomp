# Suppress dtk false-positive data relocations in LidOpenMessage image data.
# These 27 words inside HEADER_*::g_ImageData arrays coincidentally hold values
# matching code-symbol addresses (UpdateDesireState, cCharacter dtor, FormatImpl,
# etc.); they are raw compressed-image bytes, not pointers. Blocking lets the
# target object store the literal bytes so the C source byte-matches.
